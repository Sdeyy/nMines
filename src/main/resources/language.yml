# nMines language file — English defaults.
# All values are strings. Keep quotes around values containing colors, :, # or spaces.
# Use & color codes. Missing keys fall back to bundled English defaults.
# Edit this file and run /nm reload. Invalid YAML leaves the active language unchanged.
# {0}, {1}, ... are values appended by the plugin (IDs, coordinates, counts, etc.).
# {mine}, {seconds}, {cancel} and {error} are named placeholders in common messages.
# Reward text templates also accept {player}, {uuid}, {trigger}, {mine} and {region}.
# Commands, material IDs, permissions and stored player-created text are not translated.

