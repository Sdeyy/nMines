name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          persist-credentials: false

      - name: Set up Java and package authentication
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github

      - name: Check that the tag matches the Maven version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")"
          if [ "$TAG_NAME" != "v$VERSION" ]; then
            echo "The release tag must be v$VERSION."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the plugin
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload the plugin and checksum to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cd target
          sha256sum "nMines-$VERSION.jar" > "nMines-$VERSION.jar.sha256"
          gh release upload "$TAG_NAME" "nMines-$VERSION.jar" "nMines-$VERSION.jar.sha256" --clobber

      - name: Publish the Maven package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --batch-mode --no-transfer-progress deploy -DskipTests
